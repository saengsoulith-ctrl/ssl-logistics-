<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSL LOGISTICS - เช็กพัสดุ</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; background: #f4f6f8; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .item { padding: 12px; border-bottom: 1px solid #eee; font-size: 18px; font-weight: bold; color: #0f766e; }
  </style>
</head>
<body>
  <div class="card">
    <h2>📦 รายการพัสดุ SSL LOGISTICS</h2>
    <div id="list">กำลังโหลดข้อมูล...</div>
  </div>

  <script>
    const PROJECT_ID = 'kpmegijooqxnPcremsbu';
    'sb_publishable_XBjM1lI0dpk6j8yOnVuItg_00EfkMzR'

    async function loadData() {
      const list = document.getElementById('list');
      try {
        const res = await fetch(`https://${PROJECT_ID}.supabase.co/rest/v1/SSL%20LOGISTICS?select=*`, {
          headers: {
            'apikey': API_KEY,
            'Authorization': 'Bearer ' + API_KEY
          }
        });
        const data = await res.json();
        
        if (!Array.isArray(data) || data.length === 0) {
          list.innerHTML = 'ยังไม่มีข้อมูลพัสดุ (อย่าลืมปิด RLS ใน Supabase)';
          return;
        }
        list.innerHTML = data.map(row => `<div class="item">เลขพัสดุ: ${row.Tracking_no1}</div>`).join('');
      } catch (err) {
        list.innerHTML = 'เกิดข้อผิดพลาดในการเชื่อมต่อ';
      }
    }
    loadData();
  </script>
</body>
</html>
