<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSL LOGISTICS - เช็กพัสดุ</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; background: #f4f6f8; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .item { padding: 12px; border-bottom: 1px solid #eee; font-size: 18px; font-weight: bold; color: #0f766e; }
  </style>
</head>
<body>
  <div class="card">
    <h2>📦 รายการพัสดุ SSL LOGISTICS</h2>
    <div id="list">กำลังโหลดข้อมูล...</div>
  </div>

  <script>
    const SUPABASE_URL = 'https://kpmegijooqxnpcremsbu.supabase.co'
    const SUPABASE_KEY = 'sb_publishable_XBjM1lI0dpk6j8yOnVuItg_00EfkMzR';

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadData() {
      const { data, error } = await db.from('SSL LOGISTICS').select('*');
      const list = document.getElementById('list');
      
      if (error) {
        list.innerHTML = 'เกิดข้อผิดพลาด: ' + error.message;
        return;
      }
      if (data.length === 0) {
        list.innerHTML = 'ยังไม่มีข้อมูลพัสดุ';
        return;
      }
      
      list.innerHTML = data.map(row => `<div class="item">เลขพัสดุ: ${row.Tracking_no1}</div>`).join('');
    }
    loadData();
  </script>
</body>
</html>
